name: iOS Unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'vendor/**'
      - '.github/workflows/ios-ipa.yml'
      - 'src/**'
      - 'configure.ac'
      - 'm4/**'
      - '.gitattributes'
permissions:
  contents: read
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check shell script line endings
        shell: bash
        run: |
          mkdir -p ios/build/logs
          python3 ios/scripts/check_shell_scripts.py 2>&1 | tee ios/build/logs/shell-script-check.log
      - name: Show compiler versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          python3 --version
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config xcodegen openssl@3
      - name: Build and verify device IPA
        run: bash ios/scripts/build_unsigned.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FortiOneTap-unsigned-ipa
          path: |
            ios/artifacts/FortiOneTap-unsigned.ipa
            ios/artifacts/FortiOneTap-unsigned.ipa.sha256
            ios/artifacts/FortiOneTap-unsigned.verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            ios/build/logs/
            ios/build/strongswan-ios/config.log
          if-no-files-found: ignore
          retention-days: 7

